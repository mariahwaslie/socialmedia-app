{%  extends 'base.html' %}
{%  block basic_block %}
     <div class="container mt-5">
             {% if blog.created_by == request.user %}
        <h1>Delete Post</h1>

        <p>Are you sure you want to delete the post "{{ blog.title }}"?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirm Delete</button>
            <a href="{% url 'blog:post_list'%}" class="btn btn-secondary">Cancel</a>
        </form>
         {%  endif %}

    </div>
{%  endblock %}
