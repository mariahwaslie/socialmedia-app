{%  extends 'base.html' %}
{% block head_block %}


    <style>


.form-control{
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
    width: 70%;
    margin: auto;

}
{#.form-control label{ display: none}#}
.form-control p{
    margin-right: 20px;
}





    </style>
{% endblock %}






{% block basic_block %}
 <h2>{% if form.instance.pk %}Edit{% else %}Create{% endif %} Event</h2>
  <form method="post" enctype="multipart/form-data" class="form-control">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-dark">Save</button
  </form>
<script>
  tinymce.init({
      selector: '#id_description',
      plugins: 'advlist anchor autolink charmap codesample emoticons image link lists image media preview searchreplace table visualblocks wordcount linkchecker visualblocks code fullscreen insertdatetime media table paste code',
      toolbar: 'undo redo | formatselect | blocks fontfamily fontsize | bold italic underline strikethrough | link image media table mergetags | addcomment showcomments | spellcheckdialog  | align lineheight | checklist numlist bullist indent outdent | emoticons charmap | removeformat | paste',
      tinycomments_mode: 'embedded',
      tinycomments_author: 'Author name',
      {#images_upload_url: '/media/upload/',#}
      file_picker_types: 'image media',
       image_title: true,
      image_caption: true,
      automatic_uploads: true,
      image_advtab: true,
      file_picker_callback: function (cb, value, meta) {
        var input = document.createElement("input");
        input.setAttribute("type", "file");
        if (meta.filetype == "image") {
            input.setAttribute("accept", "image/*");}
        if (meta.filetype == "media") {
        input.setAttribute("accept", "video/*");}

        input.onchange = function () {
            var file = this.files[0];
            var reader = new FileReader();
            reader.onload = function () {
                var id = "blobid" + (new Date()).getTime();
                var blobCache =  tinymce.activeEditor.editorUpload.blobCache;
                var base64 = reader.result.split(",")[1];
                var blobInfo = blobCache.create(id, file, base64);
                blobCache.add(blobInfo);
               cb(blobInfo.blobUri(), { title: file.name });
             };
             reader.readAsDataURL(file);
         };
         input.click();
      },
      content_style: "body { font-family:Helvetica,Arial,sans-serif; font-size:14px }"
  });

</script>

{% endblock %}
