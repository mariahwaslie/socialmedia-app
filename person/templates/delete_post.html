{%  extends 'base.html' %}
{%  block basic_block %}
     <div class="container mt-5">
        <h1>Delete Post</h1>
             {% if post.user == request.user %}

        <p>Are you sure you want to delete the post "{{ post.title }}"?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirm Delete</button>
            <a href="{% url 'person:follow_unfollow_user' post.user.username ' ' %}" class="btn btn-secondary">Cancel</a>
        </form>
         {%  endif %}

    </div>
{%  endblock %}
