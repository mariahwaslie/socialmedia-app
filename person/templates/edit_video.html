{% extends 'base.html' %}
{% block basic_block %}
    {% if request.user == video.user %}
        <h1>Edit Video</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">Save changes</button>
            <a class="btn btn-secondary" type="">Cancel</a>
        <a href="{% url 'person:videodelete' video.id %}">Delete</a>
        </form>
        {% endif %}

{% endblock %}
